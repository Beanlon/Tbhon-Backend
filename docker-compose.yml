services:
  mysql:
    image: mysql:8.4
    container_name: tbhon_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tbhon_db
      MYSQL_USER: tbhon_user
      MYSQL_PASSWORD: tbhon_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
